services:
  - type: web
    name: tuition
    runtime: python
    region: singapore
    plan: starter            # persistent disk needs a paid plan
    branch: tuition
    rootDir: Tuition
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: TUITION_DATA_DIR
        value: /var/data/tuition
      - key: TZ
        value: Asia/Kuala_Lumpur
      - key: PYTHON_VERSION
        value: 3.12.7
    disk:
      name: tuition-data
      mountPath: /var/data
      sizeGB: 1
