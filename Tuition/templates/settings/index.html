{% extends "base.html" %}
{% block title %}{{ t('nav_settings') }}{% endblock %}
{% block content %}
<h1>{{ t('nav_settings') }}</h1>

<form method="post" class="card">
  <div class="grid c2">
    <div class="field"><label>{{ t('teacher_name') }}</label><input type="text" name="teacher_name" value="{{ s.teacher_name }}"></div>
    <div class="field"><label>{{ t('language') }}</label>
      <select name="language">
        {% for code, label in LANGS.items() %}<option value="{{ code }}" {{ 'selected' if s.language==code }}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>{{ t('currency') }}</label><input type="text" name="currency" value="{{ s.currency }}"></div>
  </div>
  <div class="field"><label>{{ t('result_subjects') }}</label><input type="text" name="result_subjects" value="{{ subjects }}"></div>
  <div class="field"><label>{{ t('payment_info') }}</label><textarea name="payment_info">{{ s.payment_info or '' }}</textarea></div>
  <div class="btn-row"><button class="btn primary">{{ t('save') }}</button></div>
</form>

<form method="post" action="{{ url_for('settings.change_password') }}" class="card">
  <h3>{{ t('change_password') }}</h3>
  <div class="grid c3">
    <div class="field"><label>{{ t('password') }}</label><input type="password" name="current" required></div>
    <div class="field"><label>{{ t('new_password') }}</label><input type="password" name="new" required></div>
    <div class="field"><label>{{ t('confirm_password') }}</label><input type="password" name="confirm" required></div>
  </div>
  <div class="btn-row"><button class="btn">{{ t('change_password') }}</button></div>
</form>
{% endblock %}
