<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Edit Budget</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='finance.css') }}">
</head>

<body>
<!-- ================= TOPBAR ================= -->
<!-- ================= 顶部栏 ================== -->

<div class="topbar">

    <div class="topbar-title">
        Budget Tracking
    </div>

    <div class="topbar-links">
        <a href="{{ url_for('finance.finance_home') }}">Dashboard</a>
        <a href="{{ url_for('finance.add_financial') }}">Add</a>
        <a href="{{ url_for('finance.view_financial') }}">View</a>
        <a href="{{ url_for('finance.summary') }}">Summary</a>
        <a href="{{ url_for('finance.budget') }}" class="active-link">Budget</a>
        <a href="{{ url_for('finance.goals') }}">Goals</a>
        <a href="{{ url_for('finance.accounts') }}">Accounts</a>
    </div>

</div>

<!-- ================= MAIN ================= -->
<!-- ================= 主区块 ================= -->

<div class="summary-wrapper">

<div class="summary-card">

    <div class="page-header">

        <h1>Edit Financial Budget</h1>

        <p>
            Update your spending limit for this category.
        </p>

    </div>

    {% if error %}
    <div class="budget-warning-banner">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Category
                </label>

                <select name="category" required>
                    {% for cat in categories|default([]) %}
                    <option value="{{ cat }}" {% if cat == budget.category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>

            </div>

            <div class="form-group">

                <label>
                    Budget Amount (RM)
                </label>

                <input
                    type="number"
                    name="amount"
                    value="{{ budget.amount }}"
                    class="goal-amount-input"
                    placeholder="0.00"
                    step="0.01"
                    min="0.01"
                    required
                >

            </div>

            <div class="form-group">

                <label>Budget Period</label>

                <select name="period">
                    <option value="weekly" {% if budget.period == 'weekly' %}selected{% endif %}>Weekly</option>
                    <option value="monthly" {% if budget.period == 'monthly' or not budget.period %}selected{% endif %}>Monthly</option>
                    <option value="yearly" {% if budget.period == 'yearly' %}selected{% endif %}>Yearly</option>
                </select>

            </div>

        </div>

        <div class="action-buttons">

            <button
                type="submit"
                class="primary-btn"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('finance.budget') }}"
                class="secondary-btn"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</div>
</body>
</html>
