<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='finance.css') }}">
</head>

<body>
<!-- ===== TOPBAR / 顶部栏 ===== -->
<div class="topbar">
    <div class="topbar-title">Accounts</div>
    <div class="topbar-links">
        <a href="{{ url_for('finance.finance_home') }}">Dashboard</a>
        <a href="{{ url_for('finance.add_financial') }}">Add</a>
        <a href="{{ url_for('finance.view_financial') }}">View</a>
        <a href="{{ url_for('finance.summary') }}">Summary</a>
        <a href="{{ url_for('finance.budget') }}">Budget</a>
        <a href="{{ url_for('finance.goals') }}">Goals</a>
        <a href="{{ url_for('finance.accounts') }}" class="active-link">Accounts</a>
        <a href="{{ url_for('finance.shopping') }}">Shopping</a>
        <a href="{{ url_for('finance.categories') }}">Categories</a>
    </div>
</div>

<div class="summary-wrapper">
    <div class="summary-card hover-card">

        <div class="page-header">
            <h1 class="summary-main-title">Edit Account</h1>
            <p class="add-subtitle">Update the name or purpose of this account. All linked transactions will be updated automatically.</p>
        </div>

        {% if error %}
        <div class="insight-box" style="margin-bottom:16px;">
            <p class="negative">{{ error }}</p>
        </div>
        {% endif %}

        <form method="POST" class="add-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>Account Name</label>
                    <input type="text" name="name" value="{{ account.name }}" required>
                </div>
                <div class="form-group">
                    <label>Purpose</label>
                    <select name="purpose">
                        <option value="spending" {% if account.purpose == 'spending' %}selected{% endif %}>Spending Account</option>
                        <option value="savings"  {% if account.purpose == 'savings'  %}selected{% endif %}>Savings Account</option>
                    </select>
                </div>
            </div>
            <div class="action-buttons" style="margin-top:16px;">
                <button type="submit" class="primary-btn">Save Changes</button>
                <a href="{{ url_for('finance.accounts') }}" class="secondary-btn">Cancel</a>
            </div>
        </form>

    </div>
</div>
</body>
</html>
